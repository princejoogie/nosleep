name: shellcheck

on:
  push:
    branches: [main]
    paths: [nosleep, .github/workflows/shellcheck.yml]
  pull_request:
    paths: [nosleep, .github/workflows/shellcheck.yml]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck --shell=bash nosleep

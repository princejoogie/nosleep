name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to publish to Homebrew (for example, 1.2.3)
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Update npm
        run: npm install --global npm@11.5.2
      - run: bun install --frozen-lockfile

      # Changesets Action accepts a custom title but does not interpolate the
      # next version. Derive it from the release plan; on the publish run there
      # are no pending changesets, so fall back to package.json.
      - name: Determine release pull request title
        id: release-title
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/changeset-status.json"
          bun run changeset status --output "$status_file"
          version="$(node -e '
            const fs = require("node:fs");
            const status = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const pkg = require("./package.json");
            process.stdout.write(status.releases[0]?.newVersion ?? pkg.version);
          ' "$status_file")"
          echo "title=release: v$version" >> "$GITHUB_OUTPUT"

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
          title: ${{ steps.release-title.outputs.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload GitHub release archive
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          archive="nosleep-$version.tar.gz"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            nosleep README.md LICENSE
          sha256sum "$archive" > "$archive.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$tag" \
              "$archive" "$archive.sha256" \
              --verify-tag \
              --generate-notes \
              --title "nosleep $version"
          fi
      - uses: actions/checkout@v6
        if: steps.changesets.outputs.published == 'true'
        with:
          repository: omsimos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew formula
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          scripts/publish-homebrew.sh "$version" "nosleep-$version.tar.gz" homebrew-tap

  recover-homebrew:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: omsimos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish existing release to Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION_INPUT" >&2
            exit 1
          fi

          tag="v$version"
          archive="nosleep-$version.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --dir "$RUNNER_TEMP"
          scripts/publish-homebrew.sh "$version" "$archive_path" homebrew-tap

name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Update npm
        run: npm install --global npm@11.5.2
      - run: bun install --frozen-lockfile
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload GitHub release archive
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          archive="nosleep-$version.tar.gz"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            nosleep README.md LICENSE
          sha256sum "$archive" > "$archive.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$tag" \
              "$archive" "$archive.sha256" \
              --verify-tag \
              --generate-notes \
              --title "nosleep $version"
          fi
      - name: Build Homebrew formula
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          archive="nosleep-$version.tar.gz"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$archive"

          sha256="$(sha256sum "$archive" | awk '{print $1}')"

          cat > nosleep.rb <<FORMULA
          class Nosleep < Formula
            desc "Keep your Mac awake with the lid closed"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "$url"
            version "$version"
            sha256 "$sha256"
            license "MIT"
            head "https://github.com/${GITHUB_REPOSITORY}.git", branch: "main"

            depends_on :macos

            def install
              bin.install "nosleep"
            end

            test do
              assert_match "Usage: nosleep", shell_output("#{bin}/nosleep --help")
            end
          end
          FORMULA

          ruby -c nosleep.rb
      - uses: actions/checkout@v6
        if: steps.changesets.outputs.published == 'true'
        with:
          repository: omsimos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish Homebrew formula
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp nosleep.rb homebrew-tap/Formula/nosleep.rb

          cd homebrew-tap
          git add Formula/nosleep.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date"
            exit 0
          fi

          version="$(node -p 'require("../package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nosleep to $version"
          git pull --rebase
          git push
